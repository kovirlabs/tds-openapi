[project]
name = "tds-openapi-tools"
version = "0.5.3"
description = "Repo tooling for tds-openapi: schema and example validation."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "jsonschema>=4.23",
    "referencing>=0.35",
    "pyyaml>=6.0",
    "rfc3339-validator>=0.1.4",
    "rfc3986-validator>=0.1.1",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "tds-conform[fuzz]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["conformance"]

[tool.uv.sources]
tds-conform = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests", "conformance/tests"]
pythonpath = ["scripts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["tds_conform", "validate_examples", "finalize_bundle"]
