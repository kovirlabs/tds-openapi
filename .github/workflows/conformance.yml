name: conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-vs-reference-mock:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        decision: [sync, async]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --package tds-conform
      - name: Start tds-mock (${{ matrix.decision }})
        run: |
          uv run --package tds-conform tds-mock --quiet --decision ${{ matrix.decision }} --decision-delay 2 &
          for i in $(seq 1 30); do curl -sf localhost:4010/health && break; sleep 1; done
      - name: Run kit
        run: uv run --package tds-conform tds-conform run --url http://localhost:4010 --profile transfer --report-dir report
      - name: Run kit (paratransit and NEMT levels)
        run: |
          uv run --package tds-conform tds-conform run --url http://localhost:4010 --profile paratransit --report-dir report-paratransit
          uv run --package tds-conform tds-conform run --url http://localhost:4010 --profile nemt --report-dir report-nemt
      - name: Check example event streams
        run: |
          for f in examples/*/events.json; do
            uv run --package tds-conform tds-conform check-events "$f" $(ls "$(dirname "$f")"/*tender*.request.json 2>/dev/null | sed 's/^/--interchange /')
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-report-${{ matrix.decision }}
          path: |
            report/
            report-paratransit/
            report-nemt/

  fuzz-vs-reference-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: npm ci
      - run: npm run bundle
      - run: uv sync --frozen --package tds-conform --extra fuzz
      - name: Start tds-mock
        run: |
          uv run --package tds-conform tds-mock --quiet &
          for i in $(seq 1 30); do curl -sf localhost:4010/health && break; sleep 1; done
      - name: Fuzz (schemathesis, positive and negative)
        run: uv run --package tds-conform tds-conform fuzz --url http://localhost:4010 --max-examples 100 --report-dir report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-report
          path: report/
