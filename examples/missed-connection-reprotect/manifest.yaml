description: 'The feeder breaks down and runs 40 minutes late. The onward provider can''t wait that long
  and counter-offers a later pickup (PARTIAL); the broker asks it to retime further and gets no answer
  by respond_by (EXPIRED, so the broker raises HOLD_UNANSWERED). A coordinator approves re-protecting
  (fallback approval: REQUIRED): the broker cancels the onward trip with MISSED_CONNECTION and tenders
  the leg to another provider, which carries the rider.'
generated_by: tds-demo generate-examples (do not edit by hand; change tds_conform/demo.py and regenerate)
narrative:
- 'Interchange ix-rp: aaata-a-ride → oakland-go at County-line transfer hub, protected'
- 'Tender to aaata-a-ride for tr-rp-a: ACCEPTED'
- 'Tender to oakland-go for tr-rp-b: ACCEPTED'
- Feeder now likely at hub 10:10; connection needs pickup ≥ 10:15
- 'Hold PARTIAL (DOWNSTREAM_COMMITMENT): oakland-go offers pickup 10:00'
- 'Asked oakland-go to retime to 10:15: PENDING'
- 'Retime is EXPIRED: broker raises HOLD_UNANSWERED; coordinator approves re-protect to county-connector'
- 'Tender to county-connector for tr-rp-b2: ACCEPTED'
- Rider reached the clinic on county-connector; oakland-go's trip CANCELLED with MISSED_CONNECTION
