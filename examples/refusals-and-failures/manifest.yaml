description: 'Everything that can go wrong short of a late feeder, so every state change has an event
  on record: a trip refused for an unsupported requirement (REJECTED), an offer left unconfirmed (EXPIRED),
  a tender rejected for capacity, a hold denied, a rider no-show on the feeder (the broker cancels the
  onward leg), a leg failed by a breakdown, and a trip the provider cancels itself.'
generated_by: tds-demo generate-examples (do not edit by hand; change tds_conform/demo.py and regenerate)
narrative:
- 'aaata-a-ride refuses tr-rf-st: UNSUPPORTED_REQUIREMENT (trip REJECTED)'
- oakland-go offers tr-rf-ox until 08:05; nobody confirms
- tr-rf-ox is EXPIRED
- 'Tender to aaata-a-ride for tr-rf-a: ACCEPTED'
- 'Tender to county-connector for tr-rf-b: REJECTED'
- 'county-connector rejects the onward leg: NO_CAPACITY; coordinator picks oakland-go'
- 'Tender to oakland-go for tr-rf-b2: ACCEPTED'
- 'Precautionary hold at oakland-go: DENIED (DOWNSTREAM_COMMITMENT)'
- 'tr-rf-f at county-connector: OFFERED → CONFIRMED'
- 'tr-rf-pc at oakland-go: OFFERED → CONFIRMED'
- 'Rider not at home: aaata-a-ride records RIDER_NO_SHOW; broker cancels the onward leg'
- 'county-connector''s vehicle breaks down on the way: LEG_FAILED (VEHICLE)'
- 'oakland-go cancels tr-rf-pc itself: PROVIDER_UNABLE'
