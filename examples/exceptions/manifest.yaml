# Broker events (SPEC.md §10.6): what a broker sends its own subscribers. Hand-written.
description: >-
  One EXCEPTION_RAISED per exception type a broker can raise, tied to the interchanges of
  the generated transfer scenarios, and an EXCEPTION_RESOLVED for each one that was
  resolved. provider_id is the broker's id; payloads carry codes and ids only.
files:
  events.json:
    kind: event-stream
