$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/csv/row-problem.yaml
title: CsvRowProblem
description: >-
  Why a requester did not apply one row of an uploaded answers or statuses
  file (SPEC.md §9.4). One code per row; when several apply, the first in this
  order. Unknown values must be treated as OTHER.
  MISSING_VALUE: a required cell is empty or its column is missing.
  INVALID_VALUE: a cell does not have its column's type or allowed values, or
  the row does not stand for a valid API object (§9.2 mapping).
  WRONG_PROVIDER: provider_id is not the provider whose mailbox received the
  file. WRONG_REQUESTER: requester_id is not this requester.
  UNKNOWN_REQUEST: an answer row whose key matches no request row this
  requester sent. UNKNOWN_TRIP: a status row about a trip and leg this
  requester did not request from the provider.
  KEY_REUSED: the row's key (answers: the request key; statuses:
  provider_id and event_id) was applied before with different content (§9.2).
  INVALID_STATE: the row cannot apply to the trip as it stands, e.g. a
  milestone out of order (§10.3) or a change to a finished trip.
  OTHER: any other reason.
x-profile: csv
type: string
enum:
  - MISSING_VALUE
  - INVALID_VALUE
  - WRONG_PROVIDER
  - WRONG_REQUESTER
  - UNKNOWN_REQUEST
  - UNKNOWN_TRIP
  - KEY_REUSED
  - INVALID_STATE
  - OTHER
examples:
  - UNKNOWN_REQUEST
