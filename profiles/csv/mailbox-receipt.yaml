$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/csv/mailbox-receipt.yaml
title: MailboxReceipt
description: >-
  Answer to PUT /inbox/{file_name} (SPEC.md §9.4). `stored: true` (201): the
  file is new and the requester will read it. `stored: false` (200): the same
  bytes were already stored under this name, so the upload was a retry and is
  applied once. Other bytes under a stored name are refused (409
  FILE_NAME_TAKEN), never overwritten.
x-profile: csv
type: object
required: [name, stored, sha256]
properties:
  name:
    description: The stored file's name.
    type: string
    minLength: 1
  stored:
    description: True when this upload stored the file; false when the same bytes were already there.
    type: boolean
  sha256:
    description: SHA-256 of the stored bytes, lowercase hex, so the agent can confirm what arrived.
    type: string
    pattern: '^[0-9a-f]{64}$'
  size:
    description: Length of the stored file in bytes.
    type: integer
    minimum: 1
  received_at:
    description: When the file was first stored (RFC 3339). A retry does not change it.
    type: string
    format: date-time
examples:
  - name: tds_answers_20261104T204000Z.csv
    stored: true
    sha256: eef2ac1723c655b97791b6abcf0e37944ccafe6e0d05bb9c104e52c36701e7cf
    size: 611
    received_at: "2026-11-04T20:40:05Z"
