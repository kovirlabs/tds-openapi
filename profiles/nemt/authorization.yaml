$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/nemt/authorization.yaml
title: NemtAuthorization
x-profile: nemt
description: >-
  The payer's authorization for a NEMT trip, by reference only (minimum
  necessary). No member id, diagnosis, procedure, visit type or clinical
  justification: the payer resolves those from authorization_ref if it needs
  them. Closed object, so nothing else can be attached.
type: object
required: [authorization_ref, payer_ref]
additionalProperties: false
properties:
  authorization_ref:
    description: The payer's authorization or prior-authorization number.
    type: string
    pattern: "^[A-Za-z0-9._:-]{1,64}$"
  payer_ref:
    description: Opaque id of the payer (state Medicaid agency, managed care plan or broker).
    type: string
    pattern: "^[A-Za-z0-9._:-]{1,64}$"
  valid_from:
    description: First date of service the authorization covers.
    type: string
    format: date
  valid_until:
    description: Last date of service the authorization covers.
    type: string
    format: date
examples:
  - authorization_ref: "PA-EXAMPLE-0001"
    payer_ref: "payer-example"
    valid_from: "2026-11-01"
    valid_until: "2026-11-30"
