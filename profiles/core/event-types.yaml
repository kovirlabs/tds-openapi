$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/event-types.yaml
title: EventTypes
description: >-
  A set of event types a subscriber wants delivered (SPEC.md §9). Lists every
  event type in this binding. TENDER_RESPONSE through CUSTODY_HANDOFF belong to
  the transfer profile and are delivered only by providers that implement it;
  EXCEPTION_RAISED and EXCEPTION_RESOLVED are delivered by brokers to their own
  subscribers, never by providers.
type: array
minItems: 1
uniqueItems: true
items:
  type: string
  enum:
    - TRIP_STATUS_CHANGED
    - TRIP_SCHEDULED
    - TRIP_CANCELLED
    - TENDER_RESPONSE
    - HOLD_RESPONSE
    - MILESTONE
    - ETA_UPDATE
    - CUSTODY_HANDOFF
    - EXCEPTION_RAISED
    - EXCEPTION_RESOLVED
examples:
  - [TRIP_STATUS_CHANGED]
