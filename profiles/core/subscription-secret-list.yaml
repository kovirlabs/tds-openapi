$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/subscription-secret-list.yaml
title: SubscriptionSecretList
description: >-
  The active signing secrets of one webhook subscription, newest first
  (SPEC.md §12.1): the answer to rotating (where the first entry is the new
  secret and carries its value) and to listing them (no values). Expired
  secrets are left out.
type: object
required: [subscription_id, secrets]
properties:
  subscription_id:
    description: The subscription these secrets sign for.
    type: string
  secrets:
    description: >-
      Active secrets, newest first. The first has no expires_at; every other
      one has. The sender signs each delivery with all of them.
    type: array
    minItems: 1
    items:
      $ref: ./subscription-secret.yaml
examples:
  - subscription_id: "sub-01"
    secrets:
      - secret_id: "sec-02"
        signing_secret: "whsec_Ml3YbU1vT9ZnM2c0cF9wLzNiVXJ4cTdlWkFrRmhzQ0Y="
        created_at: "2026-11-02T09:00:00-05:00"
      - secret_id: "sec-01"
        created_at: "2026-10-30T13:00:00-04:00"
        expires_at: "2026-11-03T09:00:00-05:00"
