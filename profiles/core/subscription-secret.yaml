$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/subscription-secret.yaml
title: SubscriptionSecret
description: >-
  One signing secret of a webhook subscription (SPEC.md §12.1). While more than
  one is active the sender signs every delivery with each of them (newest
  first), so a receiver can switch secrets without losing deliveries. The secret
  value itself is returned only in the response that creates it.
type: object
required: [secret_id, created_at]
properties:
  secret_id:
    description: >-
      Provider-assigned identifier of the secret, unique within the
      subscription. Not secret; use it to retire the secret early.
    type: string
    minLength: 1
  signing_secret:
    description: >-
      The secret value, in the same form as the subscription's signing_secret
      (`whsec_` + standard base64 of 24 to 64 random bytes, SHOULD). Present
      only in the response that creates the secret (and in a replay of that
      response with the same Idempotency-Key); never in listings.
    type: string
    minLength: 32
  created_at:
    description: When the secret was created, RFC 3339 with offset.
    type: string
    format: date-time
  expires_at:
    description: >-
      When the sender stops signing with this secret, RFC 3339 with offset.
      Absent on the newest secret, which does not expire until another one
      replaces it. Deliveries sent at or after this moment carry no signature
      made with this secret.
    type: string
    format: date-time
examples:
  - secret_id: "sec-02"
    signing_secret: "whsec_Ml3YbU1vT9ZnM2c0cF9wLzNiVXJ4cTdlWkFrRmhzQ0Y="
    created_at: "2026-11-02T09:00:00-05:00"
  - secret_id: "sec-01"
    created_at: "2026-10-30T13:00:00-04:00"
    expires_at: "2026-11-03T09:00:00-05:00"
