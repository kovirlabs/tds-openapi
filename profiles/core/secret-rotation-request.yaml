$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/secret-rotation-request.yaml
title: SecretRotationRequest
description: >-
  Body of `POST /subscriptions/{subscription_id}/secrets` (SPEC.md §12.1).
  Optional: an empty object or no body asks for the provider's default overlap.
type: object
properties:
  overlap_s:
    description: >-
      How long, in seconds from now, the subscription's older secrets stay
      valid alongside the new one. 0 retires them at once (for a leaked
      secret). Absent: the provider's default, which SHOULD be 86400 (24 hours).
      A provider MAY shorten it to its own maximum, which SHOULD be at least
      86400; it never lengthens it, and never extends an older secret's
      existing expires_at. The response's expires_at values say what applies.
    type: integer
    minimum: 0
    maximum: 2592000
examples:
  - overlap_s: 86400
  - {}
