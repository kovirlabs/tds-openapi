$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/error.yaml
title: Error
description: >-
  RFC 9457 Problem Details (media type application/problem+json) with a
  machine-readable `code` so requesters can react without parsing text.
type: object
required: [title, status, code]
properties:
  type:
    description: URI identifying the problem type. Defaults to "about:blank".
    type: string
    format: uri-reference
    default: "about:blank"
  title:
    description: Short human-readable summary of the problem type.
    type: string
  status:
    description: HTTP status code generated by the origin server.
    type: integer
    minimum: 100
    maximum: 599
  detail:
    description: Human-readable explanation specific to this occurrence.
    type: string
  instance:
    description: URI reference identifying this occurrence.
    type: string
    format: uri-reference
  code:
    description: >-
      Machine-readable reason: a protocol error, or a RefusalReason (a 422 with
      one of these leaves the trip REJECTED). TRIP_ID_IN_USE also covers a
      reused tender_id or hold_id. RATE_LIMITED (429) and
      TEMPORARILY_UNAVAILABLE (503) are back-pressure (SPEC.md §7.2): the
      request was not processed and may be retried with the same
      Idempotency-Key after retry_after_s. INVALID_FILE_NAME, EMPTY_FILE,
      FILE_TOO_LARGE and FILE_NAME_TAKEN are a relay mailbox's refusals of an
      upload (SPEC.md §9.4); NOT_FOUND there means no such file in this
      mailbox.
      Unknown values must be treated as a generic failure.
    anyOf:
      - type: string
        enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - NOT_FOUND
          - INVALID_STATE
          - IDEMPOTENCY_KEY_REUSED
          - TRIP_ID_IN_USE
          - RATE_LIMITED
          - TEMPORARILY_UNAVAILABLE
          - INVALID_FILE_NAME
          - EMPTY_FILE
          - FILE_TOO_LARGE
          - FILE_NAME_TAKEN
      - $ref: ./refusal-reason.yaml
  bookable_from:
    description: >-
      With code OUTSIDE_BOOKING_WINDOW, when the request came too early: the
      first moment a request for this trip will be inside the provider's
      booking window (trip time minus max_advance_s). Absent when waiting will
      not help (too little notice).
    type: string
    format: date-time
  retry_after_s:
    description: >-
      Back-pressure hint (SPEC.md §7.2): the least number of seconds the
      client should wait before retrying this request. Same value as the
      Retry-After response header (RFC 9110 §10.2.3), for clients that cannot
      read headers; when both are sent they SHOULD agree, and a client that
      sees both uses the larger. A provider SHOULD send it with 429 and 503,
      and MAY send it with any other 5xx. The retry repeats the same request
      with the same Idempotency-Key.
    type: integer
    minimum: 0
examples:
  - type: "about:blank"
    title: "No capacity"
    status: 409
    detail: "No vehicle with a wheelchair lift is available in the requested window."
    code: "NO_CAPACITY"
  - type: "about:blank"
    title: "Outside booking window"
    status: 422
    detail: "Trips are booked up to 14 days ahead."
    code: "OUTSIDE_BOOKING_WINDOW"
    bookable_from: "2026-11-20T09:30:00-05:00"
  - type: "about:blank"
    title: "Too many requests"
    status: 429
    detail: "More than 60 requests in a minute from this client."
    code: "RATE_LIMITED"
    retry_after_s: 20
  - type: "about:blank"
    title: "File name taken"
    status: 409
    detail: "tds_answers_20261104T204000Z.csv is already stored with other content; upload it under a new name."
    code: "FILE_NAME_TAKEN"
