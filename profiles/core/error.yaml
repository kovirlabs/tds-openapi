$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/error.yaml
title: Error
description: >-
  RFC 9457 Problem Details (media type application/problem+json) with a
  machine-readable `code` so requesters can react without parsing text.
type: object
required: [title, status, code]
properties:
  type:
    description: URI identifying the problem type. Defaults to "about:blank".
    type: string
    format: uri-reference
    default: "about:blank"
  title:
    description: Short human-readable summary of the problem type.
    type: string
  status:
    description: HTTP status code generated by the origin server.
    type: integer
    minimum: 100
    maximum: 599
  detail:
    description: Human-readable explanation specific to this occurrence.
    type: string
  instance:
    description: URI reference identifying this occurrence.
    type: string
    format: uri-reference
  code:
    description: >-
      Machine-readable reason: a protocol error, or a RefusalReason (a 422 with
      one of these leaves the trip REJECTED). TRIP_ID_IN_USE also covers a
      reused tender_id or hold_id.
      Unknown values must be treated as a generic failure.
    anyOf:
      - type: string
        enum:
          - INVALID_REQUEST
          - UNAUTHORIZED
          - NOT_FOUND
          - INVALID_STATE
          - IDEMPOTENCY_KEY_REUSED
          - TRIP_ID_IN_USE
      - $ref: ./refusal-reason.yaml
  bookable_from:
    description: >-
      With code OUTSIDE_BOOKING_WINDOW, when the request came too early: the
      first moment a request for this trip will be inside the provider's
      booking window (trip time minus max_advance_s). Absent when waiting will
      not help (too little notice).
    type: string
    format: date-time
examples:
  - type: "about:blank"
    title: "No capacity"
    status: 409
    detail: "No vehicle with a wheelchair lift is available in the requested window."
    code: "NO_CAPACITY"
  - type: "about:blank"
    title: "Outside booking window"
    status: 422
    detail: "Trips are booked up to 14 days ahead."
    code: "OUTSIDE_BOOKING_WINDOW"
    bookable_from: "2026-11-20T09:30:00-05:00"
