$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/subscription.yaml
title: Subscription
description: A registered webhook subscription.
type: object
required: [subscription_id, callback_url, event_types, created_at]
properties:
  subscription_id:
    description: Provider-assigned identifier of the subscription.
    type: string
  callback_url:
    description: HTTPS URL the provider POSTs events to.
    type: string
    format: uri
  event_types:
    description: Event types delivered to this subscription.
    $ref: ./event-types.yaml
  signing_secret:
    description: >-
      Shared secret for the X-TDS-Signature HMAC-SHA256 header (SPEC.md §12).
      Returned only in the response that creates the subscription.
    type: string
    minLength: 32
  cloudevents:
    description: >-
      True if every delivery carries CloudEvents 1.0 binary-mode `ce-*` headers
      (SPEC.md §9.1). Absent or false: the provider may still add them, but the
      subscriber must not rely on them.
    type: boolean
    default: false
  created_at:
    description: When the subscription was created, RFC 3339 with offset.
    type: string
    format: date-time
examples:
  - subscription_id: "sub-01"
    callback_url: "https://broker.example.org/tds/events"
    event_types: [TRIP_STATUS_CHANGED]
    created_at: "2026-10-30T13:00:00-04:00"
