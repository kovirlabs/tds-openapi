$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/core/subscription.yaml
title: Subscription
description: >-
  A registered webhook subscription. The answer to creating it carries the
  signing secret; reading, changing or ending it (SPEC.md §9.3) never does.
type: object
required: [subscription_id, callback_url, event_types, created_at]
properties:
  subscription_id:
    description: Provider-assigned identifier of the subscription.
    type: string
  callback_url:
    description: HTTPS URL the provider POSTs events to.
    type: string
    format: uri
  event_types:
    description: Event types delivered to this subscription.
    $ref: ./event-types.yaml
  signing_secret:
    description: >-
      Shared secret for the webhook signatures (SPEC.md §12). Returned only in
      the response that creates the subscription (and its replay under the same
      Idempotency-Key), never by GET, PATCH or DELETE (SPEC.md §9.3). Providers SHOULD issue it as
      a Standard Webhooks secret: `whsec_` followed by the standard base64 of
      24 to 64 random bytes. `webhook-signature` is keyed with those decoded
      bytes; the deprecated `X-TDS-Signature` is keyed with the UTF-8 bytes of
      the whole string. A secret in any other form gets `X-TDS-Signature`
      only.
    type: string
    minLength: 32
  signing_secret_id:
    description: >-
      Identifier of signing_secret among the subscription's secrets (SPEC.md
      §12.1), for providers that support rotating secrets with
      `POST /subscriptions/{subscription_id}/secrets`. Use it to retire this
      secret early once a newer one is in use.
    type: string
    minLength: 1
  cloudevents:
    description: >-
      True if every delivery carries CloudEvents 1.0 binary-mode `ce-*` headers
      (SPEC.md §9.1). Absent or false: the provider may still add them, but the
      subscriber must not rely on them.
    type: boolean
    default: false
  created_at:
    description: When the subscription was created, RFC 3339 with offset.
    type: string
    format: date-time
  updated_at:
    description: >-
      When the subscription was last changed with `PATCH
      /subscriptions/{subscription_id}` (SPEC.md §9.3), RFC 3339 with offset.
      Absent if it has never been changed.
    type: string
    format: date-time
examples:
  - subscription_id: "sub-01"
    callback_url: "https://broker.example.org/tds/events"
    event_types: [TRIP_STATUS_CHANGED]
    created_at: "2026-10-30T13:00:00-04:00"
