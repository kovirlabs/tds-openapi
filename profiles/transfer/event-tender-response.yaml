$schema: https://json-schema.org/draft/2020-12/schema
$id: https://tds-openapi.org/schemas/transfer/event-tender-response.yaml
title: TenderResponseEvent
description: >-
  Emitted when a tender is answered or expires, so brokers learn asynchronous decisions.
x-profile: transfer
allOf:
  - $ref: ../core/event.yaml
type: object
required: [trip_id]
properties:
  event_type:
    description: Always TENDER_RESPONSE.
    const: TENDER_RESPONSE
  payload:
    description: The tender after the decision.
    type: object
    required: [tender]
    properties:
      tender:
        description: Current tender state.
        $ref: ./tender.yaml
examples:
  - event_id: "evt-tender-response-1"
    event_type: "TENDER_RESPONSE"
    occurred_at: "2026-11-10T09:48:00-05:00"
    provider_id: "aaata-a-ride"
    trip_id: "tr-20261110-a"
    leg_id: "leg-1"
    schema_version: "0.4.0"
    payload:
      tender:
        tender_id: "tn-20261110-b"
        trip_id: "tr-20261110-a"
        interchange_id: "ix-20261110-1"
        respond_by: "2026-11-09T17:00:00-05:00"
        status: "REJECTED"
        reason: "NO_CAPACITY"
        created_at: "2026-11-09T15:00:00-05:00"
        responded_at: "2026-11-09T15:20:00-05:00"
