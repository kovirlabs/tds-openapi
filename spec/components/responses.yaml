BadRequest:
  description: The request is malformed or fails schema validation (code INVALID_REQUEST).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
Unauthorized:
  description: Missing or invalid credentials (code UNAUTHORIZED).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
NotFound:
  description: No trip with this trip_id for the authenticated requester (code NOT_FOUND).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
SubscriptionNotFound:
  description: No subscription with this subscription_id for the authenticated requester (code NOT_FOUND).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
TooManyRequests:
  description: >-
    Back-pressure (SPEC.md §7.2): this client is sending too many requests
    (code RATE_LIMITED). Nothing was processed. Retry the same request with the
    same Idempotency-Key after the wait in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
ServiceUnavailable:
  description: >-
    Back-pressure (SPEC.md §7.2): the provider cannot take requests for now,
    e.g. overload or maintenance (code TEMPORARILY_UNAVAILABLE). Nothing was
    processed. Retry the same request with the same Idempotency-Key after the
    wait in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
