BadRequest:
  description: The request is malformed or fails schema validation (code INVALID_REQUEST).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
Unauthorized:
  description: Missing or invalid credentials (code UNAUTHORIZED).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
NotFound:
  description: No trip with this trip_id for the authenticated requester (code NOT_FOUND).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
SubscriptionNotFound:
  description: No subscription with this subscription_id for the authenticated requester (code NOT_FOUND).
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
TooManyRequests:
  description: >-
    Back-pressure (SPEC.md §7.2): this client is sending too many requests
    (code RATE_LIMITED). Nothing was processed. Retry the same request with the
    same Idempotency-Key after the wait in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
ServiceUnavailable:
  description: >-
    Back-pressure (SPEC.md §7.2): the provider cannot take requests for now,
    e.g. overload or maintenance (code TEMPORARILY_UNAVAILABLE). Nothing was
    processed. Retry the same request with the same Idempotency-Key after the
    wait in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
MailboxUnauthorized:
  description: >-
    Missing or invalid mailbox token, or a credential that names no relay
    mailbox (code UNAUTHORIZED). A requester MAY answer 403 with the same code
    for a valid credential that is not a mailbox token; agents treat both the
    same way: stop and ask a person to fix the settings.
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
MailboxTooManyRequests:
  description: >-
    Back-pressure (SPEC.md §7.2): the agent is calling too often (code
    RATE_LIMITED). Nothing was processed. Repeat the same call after the wait
    in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
MailboxUnavailable:
  description: >-
    Back-pressure (SPEC.md §7.2): the mailbox cannot take calls for now (code
    TEMPORARILY_UNAVAILABLE). Nothing was processed. Repeat the same call after
    the wait in Retry-After / retry_after_s.
  headers:
    Retry-After:
      $ref: ./headers.yaml#/RetryAfter
  content:
    application/problem+json:
      schema:
        $ref: ../../profiles/core/error.yaml
