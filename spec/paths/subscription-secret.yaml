parameters:
  - $ref: ../components/parameters.yaml#/SubscriptionId
  - $ref: ../components/parameters.yaml#/SecretId
delete:
  operationId: retireSubscriptionSecret
  summary: Retire a signing secret early
  description: >-
    Stop signing with an older secret now, before its expires_at, once the
    receiver verifies with the newer one (SPEC.md §12.1). The newest secret
    cannot be retired; rotate first. Retiring a secret that has already
    expired changes nothing and returns it.
  tags: [Events]
  security:
    - oauth2: [events:subscribe]
  parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
  responses:
    "200":
      description: The secret, with expires_at no later than now. Its value is not returned.
      content:
        application/json:
          schema:
            $ref: ../../profiles/core/subscription-secret.yaml
          examples:
            retired:
              externalValue: ../../examples/secret-rotation/05-retire-old.response.json
    "400":
      $ref: ../components/responses.yaml#/BadRequest
    "401":
      $ref: ../components/responses.yaml#/Unauthorized
    "404":
      description: No such subscription for the authenticated requester, or no such secret in it (code NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
    "409":
      description: The secret is the subscription's newest one (code INVALID_STATE); rotate first.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            newest:
              externalValue: ../../examples/secret-rotation/06-retire-newest.response.json
