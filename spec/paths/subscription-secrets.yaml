parameters:
  - $ref: ../components/parameters.yaml#/SubscriptionId
post:
  operationId: rotateSubscriptionSecret
  summary: Rotate a subscription's signing secret
  description: >-
    Mint a new signing secret for the subscription (SPEC.md §12.1). The
    response carries the new value once, as the first entry; older secrets
    stay valid until their expires_at (now + overlap_s, or the provider's
    default overlap), and until then every delivery carries a
    `webhook-signature` entry for each active secret, newest first, while
    X-TDS-Signature uses the newest. A retry with the same Idempotency-Key
    returns the same new secret. Optional for providers: those that implement
    it declare `secret_rotation: true` on /health.
  tags: [Events]
  security:
    - oauth2: [events:subscribe]
  parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
  requestBody:
    required: false
    content:
      application/json:
        schema:
          $ref: ../../profiles/core/secret-rotation-request.yaml
        examples:
          one_day_overlap:
            externalValue: ../../examples/secret-rotation/02-rotate.request.json
  responses:
    "201":
      description: >-
        New secret created. The first entry is the new secret, with its value;
        the others are the older secrets still active, with expires_at.
      content:
        application/json:
          schema:
            $ref: ../../profiles/core/subscription-secret-list.yaml
          examples:
            one_day_overlap:
              externalValue: ../../examples/secret-rotation/02-rotate.response.json
    "400":
      $ref: ../components/responses.yaml#/BadRequest
    "401":
      $ref: ../components/responses.yaml#/Unauthorized
    "404":
      $ref: ../components/responses.yaml#/SubscriptionNotFound
    "409":
      description: >-
        The provider already holds as many active secrets as it allows (code
        INVALID_STATE); retire one or wait for one to expire.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
get:
  operationId: listSubscriptionSecrets
  summary: List a subscription's active signing secrets
  description: >-
    The subscription's active secrets, newest first, with ids and expiry
    times but never their values (SPEC.md §12.1).
  tags: [Events]
  security:
    - oauth2: [events:subscribe]
  responses:
    "200":
      description: Active secrets, newest first.
      content:
        application/json:
          schema:
            $ref: ../../profiles/core/subscription-secret-list.yaml
          examples:
            during_overlap:
              externalValue: ../../examples/secret-rotation/03-list-secrets.response.json
    "401":
      $ref: ../components/responses.yaml#/Unauthorized
    "404":
      $ref: ../components/responses.yaml#/SubscriptionNotFound
