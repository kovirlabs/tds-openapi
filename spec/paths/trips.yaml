post:
  operationId: requestTrip
  summary: Request a trip
  description: >-
    Ask a provider to serve a trip. A provider that decides synchronously returns
    201 with the trip OFFERED (or CONFIRMED, skipping the offer step). One that
    decides later returns 202 with the trip REQUESTED and reports the decision by
    event. Both are conformant. A synchronous refusal is a 422 whose `code` says
    why; the trip is then REJECTED.
  tags: [Trips]
  security:
    - oauth2: [trips:write]
  parameters:
    - $ref: ../components/parameters.yaml#/IdempotencyKey
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../../profiles/core/trip-request.yaml
        examples:
          single_trip:
            summary: Appointment trip, Ann Arbor to Troy
            externalValue: ../../examples/single-trip/01-request-trip.request.json
          cancellation:
            summary: Local pickup-anchored trip
            externalValue: ../../examples/cancellation/01-request-trip.request.json
          eligibility_attestation:
            summary: Senior ride with an AGE_60_PLUS fact verified by digital ID
            externalValue: ../../examples/eligibility-attestation/01-request-trip.request.json
          rider_category_facts:
            summary: Senior and disabled county resident, attested as facts for reporting
            externalValue: ../../examples/rider-category-facts/01-request-trip.request.json
          booking_window_too_early:
            summary: Trip 17 days ahead, beyond the provider's 14-day booking window
            externalValue: ../../examples/booking-window/02-request-too-early.request.json
  responses:
    "201":
      description: Decided synchronously; the trip is OFFERED or CONFIRMED.
      content:
        application/json:
          schema:
            $ref: ../../profiles/core/trip.yaml
          examples:
            single_trip:
              summary: Offered with a scheduled pickup
              externalValue: ../../examples/single-trip/01-request-trip.response.json
            eligibility_attestation:
              summary: Offered; the provider accepts DIGITAL_ID attestations
              externalValue: ../../examples/eligibility-attestation/01-request-trip.response.json
            rider_category_facts:
              summary: Offered; attestations kept as sent
              externalValue: ../../examples/rider-category-facts/01-request-trip.response.json
    "202":
      description: Accepted for an asynchronous decision; the trip is REQUESTED.
      content:
        application/json:
          schema:
            $ref: ../../profiles/core/trip.yaml
          examples:
            cancellation:
              summary: Provider will decide later
              externalValue: ../../examples/cancellation/01-request-trip.response.json
    "400":
      $ref: ../components/responses.yaml#/BadRequest
    "401":
      $ref: ../components/responses.yaml#/Unauthorized
    "409":
      description: Idempotency-Key reused with a different body (code IDEMPOTENCY_KEY_REUSED), or this requester already has a trip with this trip_id under another key (code TRIP_ID_IN_USE).
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            idempotency_key_reused:
              externalValue: ../../examples/errors/idempotency-key-reused.json
    "422":
      description: The provider refuses the trip; `code` says why and the trip is REJECTED.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            no_capacity:
              externalValue: ../../examples/errors/no-capacity.json
            eligibility_not_accepted:
              summary: The provider does not accept the attestation's verification method
              externalValue: ../../examples/eligibility-attestation/02-eligibility-not-accepted.json
            outside_booking_window:
              summary: Too early; bookable_from says when to submit again
              externalValue: ../../examples/booking-window/02-request-too-early.response.json
            too_little_notice:
              summary: Too late for the provider's minimum notice; no retry hint
              externalValue: ../../examples/booking-window/03-too-little-notice.response.json
