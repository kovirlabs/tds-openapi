parameters:
  - $ref: ../components/parameters.yaml#/MailboxFileName
put:
  operationId: putMailboxFile
  summary: Upload an answers or statuses file
  description: >-
    Store an answers or statuses file (SPEC.md §9.2) for the requester to read,
    write-once by name (SPEC.md §9.4). The body is the file's raw bytes. A new
    name is stored (201); the same bytes under a stored name are a retry (200,
    applied once); other bytes under a stored name are refused (409
    FILE_NAME_TAKEN) and never overwrite the stored file, so new content needs
    a new name. Names MUST follow SPEC.md §9.2 for answers or statuses files.
    No Idempotency-Key: the name is the key.
  tags: [Mailbox]
  parameters:
    - $ref: ../components/parameters.yaml#/RelayAgent
  requestBody:
    required: true
    content:
      text/csv:
        schema:
          type: string
        examples:
          answers_file:
            externalValue: ../../examples/relay-mailbox/tds_answers_20261104T204000Z.csv
          with_row_problems:
            summary: An upload whose report lists row problems
            externalValue: ../../examples/relay-mailbox-report/tds_answers_20261104T211500Z.csv
  responses:
    "201":
      description: Stored; the requester will read it.
      content:
        application/json:
          schema:
            $ref: ../../profiles/csv/mailbox-receipt.yaml
          examples:
            stored:
              externalValue: ../../examples/relay-mailbox/05-put.response.json
    "200":
      description: The same bytes were already stored under this name; nothing changed.
      content:
        application/json:
          schema:
            $ref: ../../profiles/csv/mailbox-receipt.yaml
          examples:
            retry:
              externalValue: ../../examples/relay-mailbox/06-put-again.response.json
    "400":
      description: >-
        The name is not an answers or statuses file name per SPEC.md §9.2 (code
        INVALID_FILE_NAME), or the body is empty (code EMPTY_FILE). The agent
        sets the file aside; repeating the call will not help.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            bad_name:
              externalValue: ../../examples/relay-mailbox/08-bad-name.response.json
            empty:
              externalValue: ../../examples/relay-mailbox/09-empty.response.json
    "401":
      $ref: ../components/responses.yaml#/MailboxUnauthorized
    "409":
      description: >-
        This name already holds other bytes (code FILE_NAME_TAKEN). The stored
        file is unchanged; export the new content under a new name.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            other_bytes:
              externalValue: ../../examples/relay-mailbox/07-put-other-bytes.response.json
    "413":
      description: >-
        Larger than the mailbox's max_file_bytes (code FILE_TOO_LARGE). Split
        the rows over several files.
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            too_large:
              externalValue: ../../examples/relay-mailbox/10-too-large.response.json
    "429":
      $ref: ../components/responses.yaml#/MailboxTooManyRequests
    "503":
      $ref: ../components/responses.yaml#/MailboxUnavailable
get:
  operationId: getMailboxReport
  summary: Read what became of an uploaded file's rows
  description: >-
    The requester's report on an answers or statuses file this agent uploaded
    (SPEC.md §9.4): RECEIVED until it is read, then PROCESSED with counts and
    an entry for every row not applied (DUPLICATE, or REJECTED with a code and,
    when one cell is at fault, its column), or REFUSED when the file could not
    be read at all. Only for requesters whose listing says
    `upload_reports: true`; others answer 404. Reports hold row numbers,
    column names and codes, never cell contents, and are kept at least 7 days
    after the file was read. Reading a report changes nothing.
  tags: [Mailbox]
  parameters:
    - $ref: ../components/parameters.yaml#/RelayAgent
  responses:
    "200":
      description: The report.
      content:
        application/json:
          schema:
            $ref: ../../profiles/csv/mailbox-report.yaml
          examples:
            all_applied:
              externalValue: ../../examples/relay-mailbox-report/02-first-report.response.json
            not_read_yet:
              externalValue: ../../examples/relay-mailbox-report/03-received.response.json
            row_problems:
              externalValue: ../../examples/relay-mailbox-report/04-report.response.json
            unreadable:
              externalValue: ../../examples/relay-mailbox-report/05-refused.response.json
    "401":
      $ref: ../components/responses.yaml#/MailboxUnauthorized
    "404":
      description: >-
        No upload with this name in this mailbox, its report has expired, or
        the requester does not report on uploads (code NOT_FOUND).
      content:
        application/problem+json:
          schema:
            $ref: ../../profiles/core/error.yaml
          examples:
            unknown_upload:
              externalValue: ../../examples/relay-mailbox-report/06-not-found.response.json
    "429":
      $ref: ../components/responses.yaml#/MailboxTooManyRequests
    "503":
      $ref: ../components/responses.yaml#/MailboxUnavailable
