asyncapi: 3.0.0
info:
  title: TDS events binding
  version: 0.7.0
  description: >-
    Events a provider delivers to a requester's webhook (SPEC.md §9, §12),
    and the exception events a broker delivers to its own subscribers. The
    requester registers a callback URL with `POST /subscriptions` (see
    openapi.yaml) and receives the signing secret once.


    **Delivery.** Each event is an HTTPS POST of one JSON event to the callback
    URL. Delivery is at least once with exponential backoff; receivers return
    2xx quickly and dedupe on `event_id`. Order is not guaranteed; use
    `occurred_at`. Providers emit an event for every change, including changes
    the requester already saw in a synchronous response.


    **Signing (SPEC.md §12).** Two header sets carry the same HMAC-SHA256
    protection. *Standard Webhooks* (standardwebhooks.com): `webhook-id` =
    `event_id`, `webhook-timestamp` = Unix seconds at send time, and
    `webhook-signature` = space-separated `v1,<base64 HMAC-SHA256 of
    "<webhook-id>.<webhook-timestamp>.<raw body>">`, one per active secret
    (several during secret rotation, newest first; a subscriber mints a new
    secret with `POST /subscriptions/{subscription_id}/secrets`, SPEC.md
    §12.1), keyed with the base64-decoded part of a
    `whsec_` secret. Senders SHOULD send them when the subscription's secret is
    in `whsec_` form. *Legacy, deprecated since 0.6.0 but still always sent*:
    `X-TDS-Timestamp` (Unix seconds) and `X-TDS-Signature` = `sha256=` + lowercase
    hex HMAC-SHA256, keyed with the UTF-8 bytes of the whole secret, of
    `<X-TDS-Timestamp>.<raw request body>`. Receivers accept a delivery when
    either signature verifies and its timestamp is within 300 seconds of their
    clock, and reject it otherwise.


    **CloudEvents (optional).** A subscription created with `cloudevents: true`
    gets CloudEvents 1.0 binary-content-mode headers on every delivery
    (SPEC.md §9.1): `ce-specversion` `1.0`, `ce-id` = `event_id`, `ce-source` =
    `urn:tds:provider:<provider_id>`, `ce-type` = `org.tds-openapi.` + the
    event type in lower case, `ce-time` = `occurred_at`, `ce-subject` =
    `trips/<trip_id>[/legs/<leg_id>]`, `ce-dataschema` = the event schema at
    `https://tds-openapi.org/schemas/<schema_version>/...`, and the extensions
    `ce-providerid` and `ce-schemaversion`. The body and `Content-Type:
    application/json` are unchanged. Receivers dedupe on (`provider_id`,
    `event_id`), which is CloudEvents (`source`, `id`).
  contact:
    name: tds-openapi maintainers
    url: https://github.com/kovirlabs/tds-openapi
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
  tags:
    - name: core
      description: Core trip events.
    - name: transfer
      description: Transfer profile events.
defaultContentType: application/json
channels:
  subscriberCallback:
    address: null
    title: Subscriber callback
    description: The callback_url given in the subscription. Events are POSTed here.
    messages:
      TripStatusChanged:
        $ref: '#/components/messages/TripStatusChanged'
      TripScheduled:
        $ref: '#/components/messages/TripScheduled'
      TripCancelled:
        $ref: '#/components/messages/TripCancelled'
      TenderResponse:
        $ref: '#/components/messages/TenderResponse'
      HoldResponse:
        $ref: '#/components/messages/HoldResponse'
      Milestone:
        $ref: '#/components/messages/Milestone'
      EtaUpdate:
        $ref: '#/components/messages/EtaUpdate'
      CustodyHandoff:
        $ref: '#/components/messages/CustodyHandoff'
      ExceptionRaised:
        $ref: '#/components/messages/ExceptionRaised'
      ExceptionResolved:
        $ref: '#/components/messages/ExceptionResolved'
operations:
  deliverTripStatusChanged:
    action: send
    title: Deliver TRIP_STATUS_CHANGED
    description: Provider POSTs a TRIP_STATUS_CHANGED event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/TripStatusChanged'
  deliverTripScheduled:
    action: send
    title: Deliver TRIP_SCHEDULED
    description: Provider POSTs a TRIP_SCHEDULED event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/TripScheduled'
  deliverTripCancelled:
    action: send
    title: Deliver TRIP_CANCELLED
    description: Provider POSTs a TRIP_CANCELLED event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/TripCancelled'
  deliverTenderResponse:
    action: send
    title: Deliver TENDER_RESPONSE
    description: Provider POSTs a TENDER_RESPONSE event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/TenderResponse'
  deliverHoldResponse:
    action: send
    title: Deliver HOLD_RESPONSE
    description: Provider POSTs a HOLD_RESPONSE event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/HoldResponse'
  deliverMilestone:
    action: send
    title: Deliver MILESTONE
    description: Provider POSTs a MILESTONE event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/Milestone'
  deliverEtaUpdate:
    action: send
    title: Deliver ETA_UPDATE
    description: Provider POSTs a ETA_UPDATE event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/EtaUpdate'
  deliverCustodyHandoff:
    action: send
    title: Deliver CUSTODY_HANDOFF
    description: Provider POSTs a CUSTODY_HANDOFF event to the subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/CustodyHandoff'
  deliverExceptionRaised:
    action: send
    title: Deliver EXCEPTION_RAISED
    description: A broker POSTs an EXCEPTION_RAISED event to its own subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/ExceptionRaised'
  deliverExceptionResolved:
    action: send
    title: Deliver EXCEPTION_RESOLVED
    description: A broker POSTs an EXCEPTION_RESOLVED event to its own subscriber's callback URL.
    channel:
      $ref: '#/channels/subscriberCallback'
    messages:
      - $ref: '#/channels/subscriberCallback/messages/ExceptionResolved'
components:
  messageTraits:
    signed:
      headers:
        $ref: '#/components/schemas/DeliveryHeaders'
  schemas:
    DeliveryHeaders:
      description: >-
        HTTP headers of one webhook delivery: the legacy signature headers
        (always), the Standard Webhooks headers (when the secret is in `whsec_`
        form) and, for subscriptions with `cloudevents: true`, the CloudEvents
        binary-mode headers (SPEC.md §9.1, §12).
      type: object
      allOf:
        - $ref: '#/components/schemas/SignatureHeaders'
        - $ref: '#/components/schemas/StandardWebhooksHeaders'
        - $ref: '#/components/schemas/CloudEventsHeaders'
    SignatureHeaders:
      description: >-
        Legacy webhook signature headers (SPEC.md §12). Deprecated since 0.6.0
        in favour of the Standard Webhooks headers, but senders still send them
        on every delivery; removal needs a major version and an RFC.
      type: object
      required: [X-TDS-Signature, X-TDS-Timestamp]
      properties:
        X-TDS-Signature:
          description: >-
            sha256=<lowercase hex HMAC-SHA256 of "<X-TDS-Timestamp>.<raw body>">,
            keyed with the UTF-8 bytes of the subscription's signing secret
            (the newest one during rotation).
          type: string
          pattern: "^sha256=[0-9a-f]{64}$"
          deprecated: true
        X-TDS-Timestamp:
          description: Unix seconds when the request was sent.
          type: string
          pattern: "^[0-9]+$"
          deprecated: true
    StandardWebhooksHeaders:
      description: >-
        Standard Webhooks signature headers (standardwebhooks.com, SPEC.md
        §12), sent together or not at all. Senders SHOULD send them when the
        signing secret is `whsec_` + base64 of 24 to 64 random bytes.
      type: object
      dependentRequired:
        webhook-signature: [webhook-id, webhook-timestamp]
        webhook-id: [webhook-timestamp, webhook-signature]
      properties:
        webhook-id:
          description: The envelope's `event_id`; the same on every retry.
          type: string
          minLength: 1
        webhook-timestamp:
          description: Unix seconds when this attempt was sent.
          type: string
          pattern: "^[0-9]+$"
        webhook-signature:
          description: >-
            Space-separated signatures, each `v1,` + base64 HMAC-SHA256 of
            "<webhook-id>.<webhook-timestamp>.<raw body>", keyed with the
            base64-decoded part of a `whsec_` secret. One per active secret
            during rotation (SPEC.md §12.1), newest first; a secret past its
            expires_at is not used. Receivers ignore versions they do not know
            (e.g. `v1a`).
          type: string
          pattern: "^v1a?,[A-Za-z0-9+/=]+( v1a?,[A-Za-z0-9+/=]+)*$"
    CloudEventsHeaders:
      description: >-
        CloudEvents 1.0 binary content mode (HTTP protocol binding). Derived
        from the envelope in the body, which stays the TDS event. Either all of
        these are sent (`ce-subject` only when the event has a `trip_id`) or
        none. Values are percent-encoded as the CloudEvents HTTP binding
        requires. Binary mode carries `datacontenttype` as `Content-Type:
        application/json`, never as a `ce-` header.
      type: object
      dependentRequired:
        ce-id:
          - ce-specversion
          - ce-source
          - ce-type
          - ce-time
          - ce-dataschema
          - ce-providerid
          - ce-schemaversion
      properties:
        ce-specversion:
          description: CloudEvents version.
          type: string
          const: "1.0"
        ce-id:
          description: The envelope's `event_id`, stable across retries.
          type: string
          minLength: 1
        ce-source:
          description: >-
            `urn:tds:provider:` followed by the envelope's `provider_id`,
            percent-encoded as a URI component. (`source`, `id`) is unique per
            event; receivers dedupe on it.
          type: string
          pattern: "^urn:tds:provider:.+$"
        ce-type:
          description: >-
            `org.tds-openapi.` followed by the envelope's `event_type` in lower
            case, e.g. `org.tds-openapi.trip_status_changed`. Upper-casing the
            suffix gives the event type back.
          type: string
          pattern: "^org\\.tds-openapi\\.[a-z][a-z0-9_]*$"
        ce-time:
          description: The envelope's `occurred_at` (RFC 3339).
          type: string
        ce-subject:
          description: >-
            `trips/<trip_id>` or `trips/<trip_id>/legs/<leg_id>` (ids
            percent-encoded as URI path segments); absent when the event has no
            `trip_id`.
          type: string
          pattern: "^trips/[^/]+(/legs/[^/]+)?$"
        ce-dataschema:
          description: >-
            The event type's schema, versioned by the envelope's
            `schema_version`:
            `https://tds-openapi.org/schemas/<schema_version>/<profile>/<schema>.yaml`.
            Removing the version segment gives the schema's `$id`.
          type: string
          format: uri
        ce-providerid:
          description: Extension attribute; the envelope's `provider_id`.
          type: string
        ce-schemaversion:
          description: Extension attribute; the envelope's `schema_version`.
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
  messages:
    TripStatusChanged:
      name: TRIP_STATUS_CHANGED
      title: Trip status changed
      summary: Every trip status change.
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/core/event-trip-status-changed.yaml
    TripScheduled:
      name: TRIP_SCHEDULED
      title: Trip scheduled
      summary: Committed times or vehicle set or changed.
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/core/event-trip-scheduled.yaml
    TripCancelled:
      name: TRIP_CANCELLED
      title: Trip cancelled
      summary: Who cancelled, why and when; sent with TRIP_STATUS_CHANGED.
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/core/event-trip-cancelled.yaml
    TenderResponse:
      name: TENDER_RESPONSE
      title: Tender answered
      summary: A tender was accepted, rejected or expired.
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-tender-response.yaml
    HoldResponse:
      name: HOLD_RESPONSE
      title: Hold answered
      summary: A hold request was answered or expired.
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-hold-response.yaml
    Milestone:
      name: MILESTONE
      title: Milestone reached
      summary: A leg reached a milestone (SPEC.md §10.3).
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-milestone.yaml
    EtaUpdate:
      name: ETA_UPDATE
      title: ETA update
      summary: ETA band for a leg's next end; heartbeat toward protected interchanges.
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-eta-update.yaml
    CustodyHandoff:
      name: CUSTODY_HANDOFF
      title: Custody handoff
      summary: A supervised rider changed custodian (SPEC.md §10.7).
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-custody-handoff.yaml
    ExceptionRaised:
      name: EXCEPTION_RAISED
      title: Exception raised
      summary: A broker raised an exception for coordinators (SPEC.md §10.6). Sent by brokers, not providers.
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-exception-raised.yaml
    ExceptionResolved:
      name: EXCEPTION_RESOLVED
      title: Exception resolved
      summary: An exception a broker raised was resolved. Sent by brokers, not providers.
      x-profile: transfer
      traits:
        - $ref: '#/components/messageTraits/signed'
      payload:
        schemaFormat: application/schema+json;version=draft-2020-12
        schema:
          $ref: ../profiles/transfer/event-exception-resolved.yaml
